appId: com.linguaforge.app
productName: LinguaForge
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

asar: true

files:
  - dist-electron/**/*
  - dist-react/**/*
  - package.json
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!**/*.{md,map}"

extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"

mac:
  category: public.app-category.education
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Для упражнений на произношение нужен доступ к микрофону"
    NSSpeechRecognitionUsageDescription: "Для распознавания речи при произношении слов"
    LSApplicationCategoryType: public.app-category.education

dmg:
  title: "Install LinguaForge"
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
